<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People Counter</title>
<link rel="stylesheet" href="ui.css">
<style>
  #job { min-height: 1.4em; }
  canvas { max-width: 100%; height: auto; display: block; margin-top: 8px; }
</style>
</head>
<body>
<h1>People Counter</h1>
<nav><strong>Single image</strong> · <a href="batch">Batch</a></nav>

<div class="field">
  <label>Client token
    <input id="token" type="password" autocomplete="off"
           placeholder="docker compose exec courier issue-token --sub demo">
  </label>
</div>

<form id="submit-form">
  <label>Image URL
    <input id="image-url" type="url" placeholder="https://example.com/people.jpg">
  </label>
  <label>or a local file
    <input id="photo" type="file" accept="image/*">
  </label>
  <button type="submit">Count people</button>
</form>

<div id="job" class="muted"></div>
<canvas id="canvas" hidden></canvas>

<script src="ui.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const token = bindToken($("token"));
const urlInput = $("image-url");
const fileInput = $("photo");
const jobLine = $("job");
const canvas = $("canvas");

// One source at a time: picking one clears the other.
urlInput.addEventListener("input", () => { fileInput.value = ""; });
fileInput.addEventListener("change", () => { urlInput.value = ""; });

function summary(result) {
  if (result.status === "succeeded") return `${result.person_count} people`;
  return `failed (${result.error.code}): ${result.error.message}`;
}

function setJobLine(text, className = "muted") {
  jobLine.textContent = text;
  jobLine.className = className;
}

// Only the latest submit is shown: a new one bumps the generation, and
// anything still running for an older one stops when it sees that.
let generation = 0;
let objectUrl = null;

$("submit-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const file = fileInput.files[0];
  const imageUrl = urlInput.value.trim();
  if (!file && !imageUrl) {
    setJobLine("Give an image URL or pick a file.", "error");
    return;
  }
  const mine = ++generation;
  const isCancelled = () => mine !== generation;
  canvas.hidden = true;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = null;
  setJobLine("Submitting...");
  let job, src;
  try {
    if (file) {
      [job] = await uploadFiles([file], token());
      // Drawn from the browser's own copy, not fetched back from the API.
      src = objectUrl = URL.createObjectURL(file);
    } else {
      job = await postToAnalysis("/analyses", token(), {
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image_url: imageUrl }),
      });
      src = imageUrl;
    }
  } catch (error) {
    if (!isCancelled()) setJobLine(error.message, "error");
    return;
  }
  if (isCancelled()) return;
  setJobLine(`Job ${job.job_id}: pending...`);
  pollResult(job.result_url, {
    isCancelled,
    onGiveUp: () => setJobLine(`Job ${job.job_id}: still pending, check later.`),
    onResult: async (result) => {
      setJobLine(`Job ${job.job_id}: ${summary(result)}`, result.status);
      if (result.status !== "succeeded") return;
      try {
        const image = await loadImage(src);
        if (isCancelled()) return;
        drawDetections(canvas, image, result.detections);
        canvas.hidden = false;
      } catch (error) {
        if (!isCancelled()) setJobLine(`${jobLine.textContent}. ${error.message}`, "error");
      }
    },
  });
});
</script>
</body>
</html>
