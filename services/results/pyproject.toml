[project]
name = "results-service"
version = "0.1.0"
description = "Results Service for the People Counter"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.31",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
