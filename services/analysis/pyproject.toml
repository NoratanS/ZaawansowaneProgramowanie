[project]
name = "analysis-service"
version = "0.1.0"
description = "Analysis Service, Worker and Courier for the People Counter"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "faststream[rabbit]>=0.6",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
