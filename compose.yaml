# The whole People Counter. First-time setup:
#   cp .env.example .env && uv run generate-keys && docker compose up
# Mint a client token: docker compose exec courier issue-token --sub demo

x-analysis: &analysis
  build: {context: ., dockerfile: services/analysis/Dockerfile}
  image: people-counter/analysis
  restart: unless-stopped
  depends_on: {rabbitmq: {condition: service_healthy}, s3: {condition: service_healthy}}
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_DEFAULT_USER:?}:${RABBITMQ_DEFAULT_PASS:?}@rabbitmq:5672/
x-check: &check {interval: 2s, retries: 30}
x-api-check: &api-check
  <<: *check
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]

services:
  analysis-api:
    <<: *analysis
    command: [python, -m, analysis_service.api.main]
    environment:
      RABBITMQ_URL: *rabbitmq-url
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
    ports: ["8000:8000"]
    healthcheck: *api-check
  worker:
    <<: *analysis
    command: [python, -m, analysis_service.worker.main]
    environment:
      RABBITMQ_URL: *rabbitmq-url
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    deploy: {replicas: 2}
  courier:
    <<: *analysis
    command: [python, -m, analysis_service.courier.main]
    # No depends_on results: the Courier must start and retry while it is down.
    environment:
      RABBITMQ_URL: *rabbitmq-url
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?}
  results:
    build: {context: ., dockerfile: services/results/Dockerfile}
    image: people-counter/results
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
    ports: ["8001:8000"]
    healthcheck: *api-check
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment: {POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"}
    # Postgres 18 keeps its data in a versioned directory under this path.
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck: {<<: *check, test: [CMD, pg_isready, -U, postgres]}
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq  # RabbitMQ names its data dir after it; fixed, it survives re-creation.
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    ports: ["15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    # No fast start_interval: an early check creates .erlang.cookie as root, which RabbitMQ can't read.
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 10s, retries: 10}
  s3:
    image: rustfs/rustfs:1.0.4  # RustFS, not MinIO: its community edition was archived in April 2026.
    restart: unless-stopped
    environment: {RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:?}", RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?}"}
    volumes: [s3-data:/data]
    healthcheck: {<<: *check, test: [CMD, curl, -sf, "http://localhost:9000/health"]}

volumes: {postgres-data: {}, rabbitmq-data: {}, s3-data: {}}
