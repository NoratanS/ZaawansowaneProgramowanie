[project]
name = "zaawansowane-programowanie"
version = "0.1.0"
description = "Repozytorium na zajecia z zaawansowane_programowanie uekat 2026"
readme = "README.md"
authors = [
    { name = "Krzysztof Bielski", email = "kbielski23@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pycodestyle>=2.15.0",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
