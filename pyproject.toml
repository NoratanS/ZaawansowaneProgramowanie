[project]
name = "zaawansowane-programowanie"
version = "0.1.0"
description = "Repozytorium na zajecia z zaawansowane_programowanie uekat 2026"
readme = "README.md"
authors = [
    { name = "Krzysztof Bielski", email = "kbielski23@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "analysis-service",
    "results-service",
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pycodestyle>=2.15.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.3",
    "testcontainers[postgres,rabbitmq]>=4.15",
    "httpx>=0.28.1",
    "pytest-httpserver>=1.2.0",
]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
analysis-service = { workspace = true }
results-service = { workspace = true }

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "unit: pure logic, no I/O",
    "integration: one service in-process against real RabbitMQ and/or Postgres",
    "e2e: full compose stack over HTTP",
    "model: the real YOLOX model on a fixture photo",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
